<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <!-- Load Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary-500': '#4f46e5',
                        'primary-600': '#4338ca',
                        'danger': '#ef4444',
                        'success': '#10b981',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Password Reset Card -->
    <div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-2xl transition-all duration-300">

        <h1 class="text-2xl font-bold text-gray-900 mb-2 text-center">Reset Password</h1>
        <p class="text-sm text-gray-500 mb-6 text-center">Enter your email or username to find your account.</p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="space-y-3 mb-6">
                {% for category, message in messages %}
                    <div class="p-3 text-sm rounded-lg text-white font-medium 
                        {% if category == 'error' %}bg-danger{% elif category == 'success' %}bg-success{% else %}bg-primary-500{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="mb-6">
                <label for="identifier" class="block text-sm font-medium text-gray-700 mb-2">Email or Username</label>
                <input
                    type="text"
                    id="identifier"
                    name="identifier"
                    required
                    placeholder="e.g., test@story.com or Tester"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500 transition duration-150 ease-in-out placeholder:text-gray-400 text-gray-900"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-primary-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-primary-600 transition-all duration-300 shadow-lg shadow-primary-500/30 active:scale-[0.98]"
            >
                Find Account
            </button>
        </form>

        <!-- Back to Login Link -->
        <div class="mt-6 text-center">
            <a href="{{ url_for('auth') }}" class="text-sm font-medium text-primary-500 hover:text-primary-600 transition duration-150 ease-in-out">
                &larr; Back to Login
            </a>
        </div>
    </div>
</body>
</html>
